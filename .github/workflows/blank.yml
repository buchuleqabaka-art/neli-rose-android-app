# Builds the debug APK, runs the unit tests and uploads the APK, all on
# GitHub's servers.
#
# It runs for every pull request into main, for every push to main, and on
# demand: Actions tab -> "Build Android APK" -> "Run workflow".
# The finished run has the APK under "Artifacts", at the bottom of its page.
# The APK is only uploaded when the build and the tests both pass.

name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and upload the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      # gradle/gradle-daemon-jvm.properties asks for Java 25.
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # gradlew is stored in git without the executable bit.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload the unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: neli-rose-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
